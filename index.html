<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baciotti</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111111;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    img {
      display: block;
      width: min(90vw, 900px);
      height: min(90vh, 900px);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="baciotti.jpeg" alt="Baciotti">
</body>
</html>
